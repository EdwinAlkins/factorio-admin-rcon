version: "2"
services:
  factorio:
    container_name: factorio-server
    image: factoriotools/factorio:stable
    restart: unless-stopped
    ports:
      # Game port: must stay reachable, that is how players connect.
      - "34197:34197/udp"
      # RCON is deliberately NOT published. The admin panel reaches it over the
      # compose network (RCON_HOST=factorio), so publishing buys nothing here --
      # and RCON hands full server control to anyone who reaches the port with
      # the password, with no rate limiting of its own.
      # Uncomment to run the panel with `npm run dev` from the host, or to drive
      # RCON with your own tooling. Keep it bound to loopback: a bare
      # "27015:27015/tcp" would expose the port to the whole LAN.
      # - "127.0.0.1:27015:27015/tcp"
    volumes:
      - ./data:/factorio
    # On `game` only: the panel reaches RCON there. Not on `control`, so a
    # compromised game server (a malicious mod runs Lua with file access) cannot
    # even resolve the control agent's name.
    networks:
      - game
    # Left unconfined on purpose: the server writes saves, mods and config to
    # /factorio, so a read-only root would break it.
    # Setting a memory limit here is safe, though, and is what gives the panel's
    # memory graph a real ceiling -- without one the Docker API reports the
    # host's RAM. Size it for your map:
    # mem_limit: 4g
    environment:
      - UPDATE_MODS_ON_START=true
      # - DLC_SPACE_AGE=false
      # Uncomment to skip updating specific mods
      # - UPDATE_IGNORE=mod1,mod2,mod3
    
    # Uncomment to enable autoupdate via watchtower
    #labels:
    #  # Labels to allow watchtower autoupdate only if no players are online
    #  - com.centurylinklabs.watchtower.enable=true
    #  - com.centurylinklabs.watchtower.scope=factorio
    #  - com.centurylinklabs.watchtower.lifecycle.pre-update="/players-online.sh"

  # The only container that mounts the Docker socket. It does not expose the
  # Docker API: it answers a closed list of operations on the `factorio`
  # service of this stack — status, CPU/memory, logs, start, stop, restart —
  # behind a shared token. No exec, no create/delete, no image, volume or
  # network call exists in its code. See services/agents/README.md.
  #
  # Still the most privileged component here: whoever controls this process
  # controls the socket, hence the confinement below.
  # Not published on any port, and alone with the panel on the `control`
  # network, which has no route out.
  # With CONTROL_ENABLED=false and METRICS_DOCKER=false, DELETE this service:
  # keeping the socket mounted for disabled features buys nothing.
  control-agent:
    container_name: factorio-control-agent
    build:
      context: services/agents
      args:
        AGENT: control-agent
    restart: unless-stopped
    # Non-root (distroless "nonroot"), plus the group that owns the socket on
    # the host. ./setup-admin.sh writes DOCKER_GID to .env; by hand:
    #   stat -c %g /var/run/docker.sock
    user: "65532:65532"
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID (run ./setup-admin.sh, or stat -c %g /var/run/docker.sock)}"
    volumes:
      # No `:ro`: on a socket it changes nothing — connecting is all it takes
      # to send writes. What protects the daemon is the agent's closed API.
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    secrets:
      - control_agent_token
    environment:
      - CONTROL_AGENT_TOKEN_FILE=/run/secrets/control_agent_token
      # The agent acts on the container carrying this Compose service label,
      # in its own Compose project (read from its own labels at startup).
      - TARGET_SERVICE=factorio
      # Grace period Docker gives Factorio between SIGTERM and SIGKILL.
      - STOP_TIMEOUT_SECONDS=${STOP_TIMEOUT_SECONDS:-60}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks:
      - control
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 32m
    pids_limit: 32

  # Web admin panel (Next.js) to run RCON commands - see README.md
  factorio-admin:
    container_name: factorio-admin-panel
    build:
      context: .
      # Spelled out rather than the `build: .` shorthand so the alternative is
      # visible here. Swap the line below for the hardened variant, which ships
      # Node and nothing else -- no shell, no package manager, no busybox:
      dockerfile: Dockerfile.distroless
      # Both images run as uid 1000 and share the same volume layout, so you can
      # switch either way without touching the database. The trade-off is that
      # `docker exec ... sh` no longer works -- see README, "Hardened image".
      # dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - factorio
      - control-agent
    ports:
      # Bound to localhost only: the panel gives full RCON access.
      # Both stacks, so browsers resolving "localhost" to ::1 also reach it.
      - "127.0.0.1:3010:3000"
      - "[::1]:3010:3000"
    volumes:
      # Mounts the directory (not the file) so a regenerated rconpw is picked up
      - ./data/config:/factorio-config:ro
      # Sessions and audit log (SQLite)
      - factorio-admin-data:/data
    secrets:
      - control_agent_token
    # `game` to reach RCON (and to publish the port above), `control` to reach
    # the control agent.
    networks:
      - game
      - control
    # The panel writes only to /data, which is a volume, so the root filesystem
    # can stay read-only. /tmp is a tmpfs purely as insurance: nothing needs it
    # today, but a Node diagnostic report or a future dependency would.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    # It binds port 3000 as uid 1000 and never changes identity, so it needs no
    # capability at all.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Measured at ~60 MB under 180 concurrent queries over a full 7-day series;
    # 256m leaves a wide margin.
    mem_limit: 256m
    pids_limit: 128
    environment:
      - RCON_HOST=factorio
      - RCON_PORT=27015
      - RCON_PASSWORD_FILE=/factorio-config/rconpw
      # Custom command catalogue, read from the mount above. The file is
      # optional: without it the panel serves the built-in actions only.
      - CUSTOM_COMMANDS_FILE=${CUSTOM_COMMANDS_FILE:-/factorio-config/commands.json}
      # Passwords: one per role. Set them in a .env file next to this compose file.
      # With none set, the panel starts but refuses every login.
      # ADMIN_PASSWORD grants full access, including the raw RCON console.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - MODERATOR_PASSWORD=${MODERATOR_PASSWORD:-}
      - VIEWER_PASSWORD=${VIEWER_PASSWORD:-}
      # Required: without it the panel starts but /api/ready reports it
      # unavailable and every request fails. ./setup-admin.sh generates one.
      - SESSION_SECRET=${SESSION_SECRET:?set SESSION_SECRET (see .env.example)}
      # auto = secure cookie as soon as the request arrives over HTTPS
      - COOKIE_SECURE=${COOKIE_SECURE:-auto}
      # Only enable behind a reverse proxy you control: it makes the panel
      # trust X-Forwarded-For for per-IP rate limiting.
      - TRUST_PROXY=${TRUST_PROXY:-false}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Tunables (see admin/.env.example for defaults)
      - SESSION_TTL_HOURS=${SESSION_TTL_HOURS:-}
      - RCON_MAX_QUEUE=${RCON_MAX_QUEUE:-}
      - RCON_MAX_PER_MINUTE=${RCON_MAX_PER_MINUTE:-}
      - RCON_TIMEOUT_MS=${RCON_TIMEOUT_MS:-}
      - STATUS_CACHE_MS=${STATUS_CACHE_MS:-}
      - AUDIT_RETENTION_DAYS=${AUDIT_RETENTION_DAYS:-}
      - AUDIT_FULL_COMMANDS=${AUDIT_FULL_COMMANDS:-}
      # Server control (start/stop/restart/logs), through the control agent.
      # CONTROL_ENABLED=false removes the Server tab and its endpoints.
      - CONTROL_ENABLED=${CONTROL_ENABLED:-}
      - CONTROL_AGENT_URL=http://control-agent:8080
      - CONTROL_AGENT_TOKEN_FILE=/run/secrets/control_agent_token
      - CONTROL_AGENT_TIMEOUT_MS=${CONTROL_AGENT_TIMEOUT_MS:-}
      - CONTROL_SAVE_TIMEOUT_MS=${CONTROL_SAVE_TIMEOUT_MS:-}
      # Metrics, master switch first, then one flag per source.
      # METRICS_ENABLED=false turns the whole feature off: no collector, no
      # Statistics tab, no /api/metrics -- and the two source flags are ignored.
      # METRICS_DOCKER=false keeps players and UPS but stops reading CPU/memory
      # from the control agent, which is what to set if you removed it.
      - METRICS_ENABLED=${METRICS_ENABLED:-}
      - METRICS_DOCKER=${METRICS_DOCKER:-}
      - METRICS_INTERVAL_MS=${METRICS_INTERVAL_MS:-}
      - METRICS_RETENTION_DAYS=${METRICS_RETENTION_DAYS:-}
      - METRICS_UPS=${METRICS_UPS:-}

  # Uncomment the following files to use watchtower for updating the factorio container
  # Full documentation of watchtower: https://github.com/containrrr/watchtower
  #watchtower:
  #  container_name: watchtower_factorio
  #  image: ghcr.io/nicholas-fedor/watchtower:latest
  #  restart: unless-stopped
  #  volumes:
  #   - /var/run/docker.sock:/var/run/docker.sock
  #  environment:
  #    # Only update containers which have the option 'watchtower.enable=true' set
  #    - WATCHTOWER_TIMEOUT=30s
  #    - WATCHTOWER_LABEL_ENABLE=true
  #    - WATCHTOWER_POLL_INTERVAL=3600
  #    - WATCHTOWER_LIFECYCLE_HOOKS=true
  #    - WATCHTOWER_SCOPE=factorio
  #  labels:
  #    - com.centurylinklabs.watchtower.scope=factorio

volumes:
  # Sessions and audit log of the admin panel
  factorio-admin-data:

networks:
  # Panel <-> game server (RCON). Not internal: the game port is published from
  # here, and the server downloads mod updates.
  game:
  # Panel <-> control agent. `internal`: no route out, nothing published.
  control:
    internal: true

secrets:
  # Shared by the panel and the control agent. Kept outside ./data, which the
  # game server mounts. ./setup-admin.sh generates it.
  control_agent_token:
    file: ./secrets/control-agent-token
