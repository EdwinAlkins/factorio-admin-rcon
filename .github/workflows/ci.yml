name: CI

# Two uses:
#   - triggered on its own for every pull request;
#   - called by release.yml (`workflow_call`) as a gate before publishing.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Stale PR runs are cancelled; release-path runs never are.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint · types · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Kept in line with the Dockerfile's `node:24-alpine`.
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Asks Docker Hub whether the image tags named in the documentation can
      # actually be pulled. The quickstart is the first thing a newcomer runs,
      # and a tag that does not exist costs more than a broken build. Skips
      # itself if the registry is unreachable.
      - run: bash scripts/check-docs-version.sh

      - run: npm run typecheck

      - run: npm test

  # The agents hold the Docker socket and the game's files: they get the race
  # detector, a vulnerability scan, gosec and the privilege-boundary test
  # (boundaries_test.go) on every PR.
  agents:
    name: Agents (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agents
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # go.mod's `toolchain` line is the single source of the Go version.
          go-version-file: services/agents/go.mod
          cache-dependency-path: services/agents/go.mod

      - run: go vet ./...

      - run: go test -race ./...

      # Reports only the vulnerabilities the code can actually reach, standard
      # library included — the reason to rebuild on a Go patch release.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      # `goinstall` builds the linter with the Go above: a prebuilt binary
      # compiled with an older Go refuses to load go.mod's language version.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-mode: goinstall
          working-directory: services/agents

  image:
    name: Build image (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Validates the Dockerfile without publishing anything. `amd64` only: we
      # are after a build error, not a shippable image — and the cache produced
      # here is reused by the multi-arch push in release.yml.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same gate for the hardened variant, which release.yml publishes under
      # `-distroless` tags. It reuses the cache above, so only its own runtime
      # stage is rebuilt here.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.distroless
          push: false
          platforms: linux/amd64
          cache-from: type=gha

      # The control agent's image, from the agents' module. A separate cache
      # scope: it shares no layer with the panel's.
      - uses: docker/build-push-action@v7
        with:
          context: services/agents
          build-args: AGENT=control-agent
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=control-agent
          cache-to: type=gha,mode=max,scope=control-agent

      - uses: docker/build-push-action@v7
        with:
          context: services/agents
          build-args: AGENT=data-agent
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=data-agent
          cache-to: type=gha,mode=max,scope=data-agent

      # The world agent's image, built on the game server's: a build check only.
      # It is never published — it must embed the very Factorio the operator's
      # server runs (FACTORIO_IMAGE), so each stack builds its own.
      - uses: docker/build-push-action@v7
        with:
          context: services/agents
          target: world-agent
          build-args: AGENT=world-agent
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=world-agent
          cache-to: type=gha,mode=max,scope=world-agent
