name: CI

# Two uses:
#   - triggered on its own for every pull request;
#   - called by release.yml (`workflow_call`) as a gate before publishing.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Stale PR runs are cancelled; release-path runs never are.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint · types · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Kept in line with the Dockerfile's `node:24-alpine`.
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

  image:
    name: Build image (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Validates the Dockerfile without publishing anything. `amd64` only: we
      # are after a build error, not a shippable image — and the cache produced
      # here is reused by the multi-arch push in release.yml.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The hardened variant is not published, but it shares the build stages
      # and would rot unnoticed if nothing ever built it. It reuses the cache
      # above, so this only rebuilds its own runtime stage.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.distroless
          push: false
          platforms: linux/amd64
          cache-from: type=gha
