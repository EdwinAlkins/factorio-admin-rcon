name: Release

on:
  push:
    # `beta` is optional: it publishes pre-releases (1.5.0-beta.1) that never
    # take the `latest` tag. See .releaserc.json.
    branches: [main, beta]

  # Recovery: (re)push an already-tagged version to Docker Hub without going
  # through semantic-release again. Useful when only the image push failed — a
  # "Re-run failed jobs" would replay the old workflow file, so it would fix
  # nothing if the bug is in the workflow itself.
  workflow_dispatch:
    inputs:
      version:
        description: "Already-tagged version to publish (e.g. 1.0.0, without the 'v')"
        required: true
        type: string

permissions:
  contents: read

# One release at a time per branch. Definitely not `cancel-in-progress`:
# interrupting semantic-release between the Git tag and the image push leaves a
# published version with no matching image.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Docker Hub namespace (williamnauroy), different from the GitHub account (EdwinAlkins).
  IMAGE_NAME: williamnauroy/factorio-admin-rcon

jobs:
  # 1. Same checks as on a PR. Nothing is published if they fail.
  #    Skipped during manual recovery: the target version was already validated.
  ci:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  # 2. semantic-release reads the conventional commits since the last tag,
  #    derives the version, writes CHANGELOG.md, tags and creates the GitHub
  #    release. If no commit warrants a version, the `version` output stays empty.
  release:
    name: semantic-release
    if: github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write        # tag, changelog commit, release creation
      issues: write          # comment on resolved issues
      pull-requests: write   # comment on the PRs included
    outputs:
      version: ${{ steps.semantic.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: semantic-release walks back to the last tag.
          fetch-depth: 0
          # Otherwise the credentials set by checkout conflict with the ones
          # semantic-release uses to push.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Release tooling deliberately kept out of package.json: it is only used
      # here, and adding it to devDependencies would install it on every
      # `npm ci` of the Docker build. Versions are pinned, see CI.md to bump them.
      - name: Run semantic-release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --yes \
            --package semantic-release@25.0.9 \
            --package @semantic-release/commit-analyzer@13.0.1 \
            --package @semantic-release/release-notes-generator@14.1.1 \
            --package @semantic-release/changelog@7.0.0 \
            --package @semantic-release/npm@13.1.5 \
            --package @semantic-release/exec@7.1.0 \
            --package @semantic-release/git@11.0.1 \
            --package @semantic-release/github@12.0.9 \
            --package conventional-changelog-conventionalcommits@10.3.0 \
            -- semantic-release

  # 3. Multi-arch build and push, either when a version was just published
  #    (push) or when an existing one is requested by hand (workflow_dispatch).
  #    `!failure() && !cancelled()` lets the *skipped* jobs of manual recovery
  #    through, while still blocking as soon as an upstream job fails.
  publish:
    name: Push Docker Hub
    needs: [ci, release]
    if: ${{ !failure() && !cancelled() && (inputs.version || needs.release.outputs.version) != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version || needs.release.outputs.version }}
    steps:
      # We build the tagged tree, not the triggering commit: that is the one
      # carrying package.json at the right version.
      - uses: actions/checkout@v7
        with:
          ref: v${{ env.VERSION }}

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Derives the tags from the version: 1.4.2 → `1.4.2`, `1.4`, `1`, `latest`.
      # `latest=auto` excludes pre-releases (1.5.0-beta.1) on its own.
      - name: Metadata (tags + OCI labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
            type=semver,pattern={{major}},value=${{ env.VERSION }}
          flavor: latest=auto
          labels: |
            org.opencontainers.image.title=Factorio RCON Admin Panel
            org.opencontainers.image.description=RCON console and administration actions for a Factorio server

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          # Build-chain traceability + package inventory.
          provenance: mode=max
          sbom: true
